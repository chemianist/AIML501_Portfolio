<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790"><rect x="0" y="0" width="1800" height="790" rx="0" fill="#F5F8FD" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1800" height="142" rx="0" fill="#142F55" stroke="none" stroke-width="1"/><text x="65" y="63" font-family="DejaVu Sans, sans-serif" font-size="37" fill="white" font-weight="800" text-anchor="start">WHICH MACHINE LEARNING METHOD FITS THE TASK?</text><text x="66" y="106" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#C8E4FF" font-weight="400" text-anchor="start">A conceptual selection roadmap — not a substitute for dataset validation</text><rect x="690" y="165" width="420" height="92" rx="16" fill="#FFFFFF" stroke="#AABDD0" stroke-width="3"/><text x="900" y="202" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183955" font-weight="700" text-anchor="middle">Do you have a</text><text x="900" y="232" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#183955" font-weight="700" text-anchor="middle">labeled target?</text><path d="M690 210 H380 V288 M1110 210 H1410 V288" fill="none" stroke="#7B94AF" stroke-width="4"/><text x="440" y="195" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#1768AF" font-weight="800" text-anchor="start">YES</text><text x="1335" y="195" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#16836A" font-weight="800" text-anchor="start">NO</text><rect x="105" y="289" width="575" height="118" rx="18" fill="#E8F2FC" stroke="#80AEDA" stroke-width="2"/><text x="390" y="335" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#145CA0" font-weight="800" text-anchor="middle">SUPERVISED</text><text x="390" y="376" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#245A87" font-weight="400" text-anchor="middle">predict a known value or label</text><rect x="1120" y="289" width="575" height="118" rx="18" fill="#E9F8F2" stroke="#83C9AE" stroke-width="2"/><text x="1410" y="335" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#13785A" font-weight="800" text-anchor="middle">UNSUPERVISED / UNLABELED</text><text x="1410" y="376" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#2C745C" font-weight="400" text-anchor="middle">discover structure or model data</text><path d="M390 407 V449 M1410 407 V449" stroke="#819BB7" stroke-width="4"/><rect x="88" y="449" width="604" height="82" rx="15" fill="white" stroke="#C8D9EB" stroke-width="2"/><text x="112" y="478" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#12569A" font-weight="800" text-anchor="start">Numeric prediction</text><text x="112" y="509" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">Linear Regression</text><rect x="88" y="543" width="604" height="82" rx="15" fill="white" stroke="#C8D9EB" stroke-width="2"/><text x="112" y="572" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#12569A" font-weight="800" text-anchor="start">Class prediction</text><text x="112" y="603" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">Logistic Regression · Tree · Forest · Naive Bayes</text><rect x="88" y="637" width="604" height="82" rx="15" fill="white" stroke="#C8D9EB" stroke-width="2"/><text x="112" y="666" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#12569A" font-weight="800" text-anchor="start">Images with labels</text><text x="112" y="697" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">CNN (or Tree on extracted features)</text><rect x="1108" y="449" width="604" height="82" rx="15" fill="white" stroke="#C5E1D6" stroke-width="2"/><text x="1133" y="478" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#157457" font-weight="800" text-anchor="start">Group similar examples</text><text x="1133" y="509" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">K-means clustering or DBSCAN</text><rect x="1108" y="543" width="604" height="82" rx="15" fill="white" stroke="#C5E1D6" stroke-width="2"/><text x="1133" y="572" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#157457" font-weight="800" text-anchor="start">Reduce dimensions</text><text x="1133" y="603" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">PCA</text><rect x="1108" y="637" width="604" height="82" rx="15" fill="white" stroke="#C5E1D6" stroke-width="2"/><text x="1133" y="666" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#157457" font-weight="800" text-anchor="start">Generate new examples</text><text x="1133" y="697" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#35485D" font-weight="400" text-anchor="start">GAN (often unlabeled training)</text><text x="900" y="751" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#54667B" font-weight="500" text-anchor="middle">Final choice also depends on data type, interpretability, accuracy, latency, and evaluation metrics.</text></svg>